<polyline points="940,150 940,210" fill="none" stroke="#c06a10" stroke-width="1.4" marker-end="url(#ao)"/>
<polyline points="940,300 940,360" fill="none" stroke="#c06a10" stroke-width="1.4" marker-end="url(#ao)"/>
<rect x="1030" y="210" width="160" height="90" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="1110.0" y="251.42499999999998" font-size="11" fill="#333333" text-anchor="middle" font-weight="bold">MatMul (generic CPU)</text>
<text x="1110.0" y="266.275" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal">matmul_evta 조건</text>
<polyline points="1110,150 1110,210" fill="none" stroke="#c06a10" stroke-width="1.4" marker-end="url(#ao)"/>
<polyline points="1110,300 1110,360" fill="none" stroke="#c06a10" stroke-width="1.4" marker-end="url(#ao)"/>
<rect x="1200" y="210" width="160" height="90" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="1280.0" y="251.42499999999998" font-size="11" fill="#333333" text-anchor="middle" font-weight="bold">saveChannelwiseConv…</text>
<text x="1280.0" y="266.275" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal">dw_convolution_evta 조건</text>
<polyline points="1280,150 1280,210" fill="none" stroke="#c06a10" stroke-width="1.4" marker-end="url(#ao)"/>
<polyline points="1280,300 1280,360" fill="none" stroke="#c06a10" stroke-width="1.4" marker-end="url(#ao)"/>
<rect x="690" y="360" width="670" height="50" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="1025.0" y="389.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">ctx.cpuGemms (명령, 이유) → 끝에 한꺼번에 출력</text>
<polyline points="1025,410 1025,460" fill="none" stroke="#c06a10" stroke-width="1.6" marker-end="url(#ao)"/>
<text x="700" y="620" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">①은 &quot;EVTA에서 돌지만 꼬리를 못 받은 것&quot;, ②는 &quot;EVTA에서 아예 안 도는 GEMM&quot;을 보여 준다. 둘 다 stderr에만 쓰고 번들은 같다.</text>
<text x="700" y="650" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">이유는 조건을 다시 쓰지 않고 실제로 EVTA 길을 떠나는 자리에서 적는다 (판정과 로그가 어긋나지 않게).</text>
