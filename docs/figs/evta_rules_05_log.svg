<text x="56" y="292" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">  MaxPool_30__2 (maxpool)</text>
<text x="56" y="320" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">  &lt;- a tail op not fused (a CPU pool)</text>
<text x="56" y="348" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">13 EVTA producers, 4 with a tail,</text>
<text x="56" y="376" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">  1 read by a tail op not fused</text>
<text x="40" y="446" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">② CPU GEMM 줄 (번들을 다 낸 뒤, 2026-11-20 추가)</text>
