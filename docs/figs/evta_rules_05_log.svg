<text x="56" y="488" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">cpu …layer_11_attention_MatMul_MatMul_0__2: matmul 2 x 64 x 198: 2 rows: no H x W with W &gt;= 7 (largest W 1)</text>
<text x="56" y="516" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">cpu Conv_…expanded_conv_2_expand…: conv: input channels 24 not a multiple of 16   (-vta-pad-channels=0일 때)</text>
<text x="56" y="544" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">6 GEMMs on the CPU</text>
