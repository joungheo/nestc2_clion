<text x="416.0" y="370.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#777777" xml:space="preserve">forwarding (1~3 clk 전 쓰기)</text>
<text x="40.0" y="420.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#222222" xml:space="preserve">forwarding이 필요한 이유</text>
<text x="40.0" y="435.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222222" xml:space="preserve">• acc를 읽고(S0 주소 → S2 데이터) 쓰기(S3)까지 3 clk. 같은 dst가 1~3 clk 안에 다시 오면 BRAM에는 아직 옛 값이 있다.</text>
<text x="40.0" y="451.1" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222222" xml:space="preserve">  sa_rmw는 S3의 sum과 1, 2 clk 전에 쓴 sum(w1, w2)을 들고 있다가 주소가 같으면 BRAM 대신 그것을 old로 쓴다(S1에서 비교해 S2에서 선택).</text>
<text x="40.0" y="466.6" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222222" xml:space="preserve">• 이 때문에 HLS EVTA의 'DEPENDENCE false' 가정(같은 dst를 몇 단계 안에 다시 읽지 않음) 없이도 결과가 맞다(RTL testbench hazard / same 모드).</text>
<text x="40.0" y="482.1" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#222222" xml:space="preserve">acc_mem 포트</text>
<text x="40.0" y="497.6" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222222" xml:space="preserve">• 포트 A = 읽기만(EN 항상 1, 출력 register), 포트 B = 쓰기만. 한 clk에 읽기 하나 + 쓰기 하나 → 단계마다 1 clk.</text>
<text x="40.0" y="513.1" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#222222" xml:space="preserve">400 MHz</text>
<text x="40.0" y="528.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#222222" xml:space="preserve">• S2(선택 + 32비트 덧셈 16 lane)가 가장 빡빡한 경로라 비교는 S1으로, bias 행의 '행 = 0'도 S1에서. requantize는 S4~S6로 따로.</text>
</svg>
