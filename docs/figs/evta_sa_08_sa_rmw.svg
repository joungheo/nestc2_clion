<rect x="216.0" y="160.0" width="134.0" height="50.0" rx="6" fill="#fff3c4" stroke="#9a7b00" stroke-width="1.4"/>
<text x="283.0" y="175.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">forwarding 비교</text>
<text x="283.0" y="188.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">진행 중 쓰기 3개와</text>
<text x="283.0" y="201.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">읽은 주소 비교</text>
