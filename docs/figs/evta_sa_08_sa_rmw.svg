<title>systolic EVTA 8. sa_rmw (sa_rmw.v): acc read-modify-write와 out 쓰기 (11-04 bias reset, requantize 포함)</title>
<defs>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
