<text x="451.0" y="192.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">(포트 A, 2 clk)</text>
<rect x="384.0" y="220.0" width="134.0" height="44.0" rx="6" fill="#fff3c4" stroke="#9a7b00" stroke-width="1.4"/>
<text x="451.0" y="238.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">old = forward</text>
<text x="451.0" y="251.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">? S3/w1/w2 : 데이터</text>
<rect x="384.0" y="280.0" width="134.0" height="36.0" rx="6" fill="#fff3c4" stroke="#9a7b00" stroke-width="1.4"/>
<text x="451.0" y="294.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">sum = old + 행</text>
<text x="451.0" y="307.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">(16 lane int32)</text>
<rect x="520.0" y="282.0" width="10.0" height="30.0" rx="1" fill="#3c8a35" stroke="#245e1f" stroke-width="1"/>
<path d="M520,304 L526,308 L520,312" fill="none" stroke="#ffffff" stroke-width="1"/>
<rect x="552.0" y="160.0" width="134.0" height="48.0" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
<text x="619.0" y="174.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">acc 쓰기 (포트 B)</text>
<text x="619.0" y="187.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">reset &amp;&amp; !bias ? 0</text>
<text x="619.0" y="200.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">: sum</text>
<rect x="552.0" y="226.0" width="134.0" height="40.0" rx="6" fill="#fff3c4" stroke="#9a7b00" stroke-width="1.4"/>
<text x="619.0" y="242.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">forwarding 원천</text>
<text x="619.0" y="255.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">s3, w1, w2 register</text>
<rect x="552.0" y="280.0" width="134.0" height="36.0" rx="6" fill="#fbdcdc" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="619.0" y="301.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">out ← sum 하위 8비트</text>
<rect x="720.0" y="190.0" width="134.0" height="60.0" rx="6" fill="#dcefd6" stroke="#3c8a35" stroke-width="1.4"/>
<text x="787.0" y="210.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">t = sum + r</text>
<text x="787.0" y="223.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">r = 2^(s−1)</text>
<text x="787.0" y="236.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">[− (sum&lt;0)]</text>
<rect x="856.0" y="204.0" width="10.0" height="30.0" rx="1" fill="#3c8a35" stroke="#245e1f" stroke-width="1"/>
<path d="M856,226 L862,230 L856,234" fill="none" stroke="#ffffff" stroke-width="1"/>
<rect x="888.0" y="190.0" width="134.0" height="60.0" rx="6" fill="#dcefd6" stroke="#3c8a35" stroke-width="1.4"/>
<text x="955.0" y="216.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">h = t &gt;&gt;&gt; shift</text>
<text x="955.0" y="229.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">(산술, 5단 mux)</text>
<rect x="1024.0" y="204.0" width="10.0" height="30.0" rx="1" fill="#3c8a35" stroke="#245e1f" stroke-width="1"/>
<path d="M1024,226 L1030,230 L1024,234" fill="none" stroke="#ffffff" stroke-width="1"/>
<rect x="1056.0" y="190.0" width="134.0" height="60.0" rx="6" fill="#dcefd6" stroke="#3c8a35" stroke-width="1.4"/>
<text x="1123.0" y="210.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">h &lt; lo ? lo :</text>
<text x="1123.0" y="223.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">h &gt; hi ? hi :</text>
<text x="1123.0" y="236.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">h[7:0]</text>
<rect x="1056.0" y="280.0" width="134.0" height="36.0" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
<text x="1123.0" y="301.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">out 쓰기 (int8)</text>
<rect x="1056.0" y="330.0" width="134.0" height="36.0" rx="6" fill="#dcefd6" stroke="#3c8a35" stroke-width="1.4"/>
