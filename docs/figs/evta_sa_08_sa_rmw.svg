</defs>
<rect x="0.0" y="0.0" width="1460.0" height="760.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
<text x="24.0" y="38.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#222222" xml:space="preserve">systolic EVTA 8. sa_rmw (sa_rmw.v): acc read-modify-write와 out 쓰기 (11-04 bias reset, requantize 포함)</text>
<text x="24.0" y="64.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#444444" xml:space="preserve">행(16 × 20비트 부분합)과 tag가 같은 clk에 온다. acc[dst]를 읽어(포트 A, 2 clk) 더하고 S3에 쓴다(포트 B). 앞 행이 같은 dst를 아직 쓰는 중이면 그 값을 가져온다(forwarding).</text>
<text x="24.0" y="84.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#444444" xml:space="preserve">out에는 S6에서 requantize한 int8을 쓴다(rq_en = 0이면 하위 8비트). done / token / busy는 out 쓰기에 맞춘다.</text>
<rect x="40.0" y="130.0" width="150.0" height="250.0" rx="4" fill="#fffbea" stroke="#d9c98a" stroke-width="1"/>
<text x="115.0" y="146.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222" xml:space="preserve">S0</text>
<rect x="208.0" y="130.0" width="150.0" height="250.0" rx="4" fill="#fffbea" stroke="#d9c98a" stroke-width="1"/>
<text x="283.0" y="146.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222" xml:space="preserve">S1</text>
<rect x="376.0" y="130.0" width="150.0" height="250.0" rx="4" fill="#fffbea" stroke="#d9c98a" stroke-width="1"/>
<text x="451.0" y="146.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222" xml:space="preserve">S2</text>
<rect x="544.0" y="130.0" width="150.0" height="250.0" rx="4" fill="#fffbea" stroke="#d9c98a" stroke-width="1"/>
