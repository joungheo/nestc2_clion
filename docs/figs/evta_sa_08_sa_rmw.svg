<rect x="1048.0" y="130.0" width="150.0" height="250.0" rx="4" fill="#eef8ea" stroke="#9fcf93" stroke-width="1"/>
<text x="1123.0" y="146.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222222" xml:space="preserve">S6</text>
<rect x="48.0" y="160.0" width="134.0" height="40.0" rx="6" fill="#fff3c4" stroke="#9a7b00" stroke-width="1.4"/>
<text x="115.0" y="176.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">tag: dst, reset</text>
<text x="115.0" y="190.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">+ bias, src</text>
<rect x="48.0" y="216.0" width="134.0" height="44.0" rx="6" fill="#dcefd6" stroke="#3c8a35" stroke-width="1.4"/>
