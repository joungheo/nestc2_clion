<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title>그림 A3. group k → k+1: load 큐의 첫 pop들이 어느 push를 받나 (thread 2개, 입력 채널 블록 C개)</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f98"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c06a10"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c8a35"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d4596"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a7b00"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker></defs>
<rect x="0" y="0" width="1400" height="860" fill="#ffffff"/>
<text x="700.0" y="34" font-size="19" fill="#333333" text-anchor="middle" font-weight="bold">그림 A3. group k → k+1: load 큐의 첫 pop들이 어느 push를 받나 (thread 2개, 입력 채널 블록 C개)</text>
<text x="40" y="80" font-size="16" fill="#333333" text-anchor="start" font-weight="bold">① 전: 다음 group의 첫 LOAD는 그 group의 reset 토큰을 받는다 → reset은 STORE 대기 뒤</text>
<text x="40" y="120" font-size="14" fill="#333333" text-anchor="start" font-weight="bold">compute</text>
<rect x="130" y="100" width="118" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="189.0" y="121.10000000000001" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">GEMM k</text>
<text x="189.0" y="137.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=C-1 t0 ▲</text>
<rect x="258" y="100" width="118" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="317.0" y="121.10000000000001" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">GEMM k</text>
<text x="317.0" y="137.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=C-1 t1 ▲</text>
<rect x="386" y="100" width="118" height="50" rx="4" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="445.0" y="121.10000000000001" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">epilogue k</text>
<text x="445.0" y="137.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">(ALU)</text>
<rect x="514" y="100" width="118" height="50" rx="4" fill="#f1eaf8" stroke="#6d4596" stroke-width="1.6"/>
<text x="573.0" y="121.10000000000001" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼ STORE k</text>
<text x="573.0" y="137.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">대기</text>
<rect x="642" y="100" width="118" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="701.0" y="121.10000000000001" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">reset k+1</text>
<text x="701.0" y="137.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">t0 ▲</text>
<rect x="770" y="100" width="118" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="829.0" y="121.10000000000001" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">reset k+1</text>
<text x="829.0" y="137.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">t1 ▲</text>
<rect x="898" y="100" width="118" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="957.0" y="121.10000000000001" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">GEMM k+1</text>
<text x="957.0" y="137.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=0 t0</text>
<rect x="1026" y="100" width="118" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="1085.0" y="121.10000000000001" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">GEMM k+1</text>
<text x="1085.0" y="137.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=0 t1</text>
<text x="40" y="230" font-size="14" fill="#333333" text-anchor="start" font-weight="bold">load</text>
<rect x="130" y="210" width="150" height="50" rx="4" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="205.0" y="231.1" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼▼ 끝 pop</text>
<text x="205.0" y="247.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">(GEMM k 토큰)</text>
<rect x="290" y="210" width="150" height="50" rx="4" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="365.0" y="231.1" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">residual k</text>
<text x="365.0" y="247.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">→ inp 0/1024</text>
<rect x="450" y="210" width="150" height="50" rx="4" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="525.0" y="231.1" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼ 입력 k+1</text>
<text x="525.0" y="247.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=0 t0</text>
<rect x="610" y="210" width="150" height="50" rx="4" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="685.0" y="231.1" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼ 가중치</text>
<text x="685.0" y="247.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=0 t1</text>
<rect x="770" y="210" width="150" height="50" rx="4" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="845.0" y="231.1" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼ 입력</text>
<text x="845.0" y="247.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=1 ...</text>
<polyline points="189.0,150 185.0,210" fill="none" stroke="#2f5f98" stroke-width="1.6" marker-end="url(#ab)"/>
<polyline points="317.0,150 225.0,210" fill="none" stroke="#2f5f98" stroke-width="1.6" marker-end="url(#ab)"/>
<polyline points="701.0,150 525.0,210" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="829.0,150 685.0,210" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
<text x="700" y="300" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal">빨강: 입력 k+1은 reset k+1 뒤 = epilogue k와 STORE k가 끝난 뒤에야 DRAM에서 읽기 시작</text>
<text x="40" y="360" font-size="16" fill="#333333" text-anchor="start" font-weight="bold">② 후: 마지막 GEMM 토큰을 다음 group의 첫 LOAD가 받고, residual은 epilogue 토큰을 받는다</text>
<text x="40" y="400" font-size="14" fill="#333333" text-anchor="start" font-weight="bold">compute</text>
<rect x="130" y="380" width="112" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="186.0" y="401.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">GEMM k</text>
<text x="186.0" y="417.29999999999995" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=C-1 t0 ▲</text>
<rect x="252" y="380" width="112" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="308.0" y="401.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">GEMM k</text>
<text x="308.0" y="417.29999999999995" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=C-1 t1 ▲</text>
<rect x="374" y="380" width="112" height="50" rx="4" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="430.0" y="401.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">epilogue k</text>
<text x="430.0" y="417.29999999999995" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">t0 ▲E</text>
<rect x="496" y="380" width="112" height="50" rx="4" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="552.0" y="401.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">epilogue k</text>
<text x="552.0" y="417.29999999999995" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">t1 ▲E</text>
<rect x="618" y="380" width="112" height="50" rx="4" fill="#f1eaf8" stroke="#6d4596" stroke-width="1.6"/>
<text x="674.0" y="401.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼ STORE k</text>
<text x="674.0" y="417.29999999999995" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">대기</text>
<rect x="740" y="380" width="112" height="50" rx="4" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="796.0" y="401.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">reset k+1</text>
<text x="796.0" y="417.29999999999995" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">(토큰 없음)</text>
<rect x="862" y="380" width="112" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="918.0" y="401.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">GEMM k+1</text>
<text x="918.0" y="417.29999999999995" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=0 t0 ▼</text>
<rect x="984" y="380" width="112" height="50" rx="4" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="1040.0" y="401.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">GEMM k+1</text>
<text x="1040.0" y="417.29999999999995" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=0 t1 ▼</text>
<rect x="1106" y="380" width="112" height="50" rx="4" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="1162.0" y="401.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼▼ residual</text>
<text x="1162.0" y="417.29999999999995" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">토큰 받기</text>
<text x="40" y="510" font-size="14" fill="#333333" text-anchor="start" font-weight="bold">load</text>
<rect x="130" y="490" width="150" height="50" rx="4" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="205.0" y="511.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼ 입력 k+1</text>
<text x="205.0" y="527.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=0 t0</text>
<rect x="290" y="490" width="150" height="50" rx="4" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="365.0" y="511.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼ 가중치</text>
<text x="365.0" y="527.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=0 t1</text>
<rect x="450" y="490" width="150" height="50" rx="4" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="525.0" y="511.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼E residual</text>
<text x="525.0" y="527.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">k+1 t0 ▲</text>
<rect x="610" y="490" width="150" height="50" rx="4" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="685.0" y="511.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼E residual</text>
<text x="685.0" y="527.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">k+1 t1 ▲</text>
<rect x="770" y="490" width="150" height="50" rx="4" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="845.0" y="511.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼ 입력</text>
<text x="845.0" y="527.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=1 t0</text>
<rect x="930" y="490" width="150" height="50" rx="4" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="1005.0" y="511.09999999999997" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">▼ 가중치</text>
<text x="1005.0" y="527.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">c=1 t1</text>
<polyline points="186.0,430 205.0,490" fill="none" stroke="#3c8a35" stroke-width="2" marker-end="url(#ag)"/>
<polyline points="308.0,430 365.0,490" fill="none" stroke="#3c8a35" stroke-width="2" marker-end="url(#ag)"/>
<polyline points="430.0,430 525.0,490" fill="none" stroke="#3c8a35" stroke-width="2" marker-end="url(#ag)"/>
<polyline points="552.0,430 685.0,490" fill="none" stroke="#3c8a35" stroke-width="2" marker-end="url(#ag)"/>
<polyline points="205.0,540 205.0,562 918.0,562 918.0,430" fill="none" stroke="#c06a10" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ao)"/>
<polyline points="525.0,540 525.0,580 1162.0,580 1162.0,430" fill="none" stroke="#9a7b00" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#ay)"/>
<rect x="40" y="610" width="1320" height="230" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="60" y="640" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">load 큐의 pop 순서 (group k+1):  c=0 t0, c=0 t1  →  residual t0, t1  →  c=1 t0, c=1 t1  →  …  →  c=C-1</text>
<text x="60" y="667" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">compute 큐의 push 순서 (group k): GEMM c=0 ×2, …, GEMM c=C-1 ×2  →  epilogue t0, t1 (▲E)</text>
<text x="60" y="694" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">→ group k+1의 c=0 pop 2개 = GEMM k c=C-1 (녹색)   residual pop 2개 = ▲E   c=1 pop = GEMM k+1 c=0 … (규칙 1)</text>
<text x="60" y="721" font-size="14" fill="#333333" text-anchor="start" font-weight="normal"></text>
<text x="60" y="748" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">run의 첫 group: reset이 토큰 2개 + 2개를 더 낸다 (c=0용과 residual용).</text>
<text x="60" y="775" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">run의 마지막 group: 끝 pop 2개(GEMM 토큰)를 그대로 하고 ▲E는 내지 않는다 → run 끝 상태가 전과 같다 (규칙 2).</text>
<text x="60" y="802" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">compute 쪽: GEMM k+1 c=0 다음에 residual LOAD의 토큰 2개를 받는다 (점선). epilogue에서는 따로 pop하지 않는다.</text>
</svg>
