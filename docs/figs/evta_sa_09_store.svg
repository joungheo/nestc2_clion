<line x1="120.0" y1="153.0" x2="120.0" y2="179.0" stroke="#9a7b00" stroke-width="0.6"/>
<line x1="146.7" y1="153.0" x2="146.7" y2="179.0" stroke="#9a7b00" stroke-width="0.6"/>
<line x1="173.3" y1="153.0" x2="173.3" y2="179.0" stroke="#9a7b00" stroke-width="0.6"/>
