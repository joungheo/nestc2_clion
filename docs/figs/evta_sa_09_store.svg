<text x="264.0" y="142.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#6d4596" xml:space="preserve">store (HLS IP)</text>
<rect x="280.0" y="160.0" width="330.0" height="60.0" rx="5" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
<text x="445.0" y="179.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">명령 해독</text>
<text x="445.0" y="193.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">VTAMemInsn: sram_base, dram_base,</text>
<text x="445.0" y="207.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">y_size, x_size, x_stride</text>
<rect x="280.0" y="250.0" width="680.0" height="90.0" rx="5" fill="#ece2f4" stroke="#6d4596" stroke-width="1.4"/>
<text x="620.0" y="277.4" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">2D 복사</text>
<text x="620.0" y="291.6" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">행 y = 0 … y_size−1 (PIPELINE):</text>
<text x="620.0" y="305.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">  memcpy(DRAM[dram_idx × 16 B] ← out_mem[sram_idx], x_size × 16 B) burst</text>
<text x="620.0" y="319.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">  sram_idx += x_size, dram_idx += x_stride</text>
<rect x="280.0" y="370.0" width="330.0" height="60.0" rx="5" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
<text x="445.0" y="396.6" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">out_mem 포트 B 읽기</text>
<text x="445.0" y="410.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">128b = int8 × 16 / clk</text>
<rect x="640.0" y="370.0" width="320.0" height="60.0" rx="5" fill="#eeeeee" stroke="#666666" stroke-width="1.4"/>
<text x="800.0" y="396.6" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">m_axi data_port (128비트)</text>
<text x="800.0" y="410.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">AXI4 burst 쓰기</text>
<line x1="202.0" y1="166.0" x2="278.0" y2="185.0" stroke="#6d4596" stroke-width="1.6" marker-end="url(#arp)"/>
<line x1="162.0" y1="264.0" x2="278.0" y2="210.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="220.0" y="257.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#b03a2e" xml:space="preserve">g2s pop</text>
<line x1="445.0" y1="342.0" x2="445.0" y2="368.0" stroke="#333333" stroke-width="1.2" marker-end="url(#ara)"/>
<line x1="800.0" y1="342.0" x2="800.0" y2="368.0" stroke="#333333" stroke-width="1.2" marker-end="url(#ara)"/>
<line x1="278.0" y1="410.0" x2="162.0" y2="360.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="210.0" y="399.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#b03a2e" xml:space="preserve">s2g push</text>
<rect x="1050.0" y="160.0" width="170.0" height="60.0" rx="3" fill="#e6eef7" stroke="#4a6f9a" stroke-width="1.4"/>
<text x="1135.0" y="187.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#222222" xml:space="preserve">out_mem</text>
<text x="1135.0" y="202.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222" xml:space="preserve">4096 × 128b</text>
<rect x="1046.0" y="164.0" width="22.0" height="16.0" rx="2" fill="#ffffff" stroke="#4a6f9a" stroke-width="0.8"/>
<text x="1057.0" y="176.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#222222" xml:space="preserve">A</text>
<text x="1042.0" y="176.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="end" font-weight="normal" fill="#4a6f9a" xml:space="preserve">compute</text>
<rect x="1202.0" y="200.0" width="22.0" height="16.0" rx="2" fill="#ffffff" stroke="#4a6f9a" stroke-width="0.8"/>
<text x="1213.0" y="212.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#222222" xml:space="preserve">B</text>
<text x="1228.0" y="212.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="9.5" text-anchor="start" font-weight="normal" fill="#4a6f9a" xml:space="preserve">store</text>
<rect x="1050.0" y="340.0" width="360.0" height="80.0" rx="5" fill="#efe6d6" stroke="#8a6d3b" stroke-width="1.4"/>
<text x="1230.0" y="369.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">DRAM</text>
<text x="1230.0" y="383.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">outputs (다음 층 입력 / 결과)</text>
<text x="1230.0" y="397.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">dram_base × 16 B</text>
<line x1="1048.0" y1="205.0" x2="612.0" y2="395.0" stroke="#3c8a35" stroke-width="1.6" marker-end="url(#arg)"/>
<text x="830.0" y="292.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#3c8a35" xml:space="preserve">B 읽기</text>
<line x1="962.0" y1="400.0" x2="1048.0" y2="380.0" stroke="#2f5f98" stroke-width="1.8" marker-end="url(#arb)"/>
<text x="1005.0" y="382.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#2f5f98" xml:space="preserve">burst 쓰기</text>
<text x="40.0" y="500.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" xml:space="preserve">• out_mem에는 compute가 GEMM / ALU 단계마다 acc의 하위 8비트를 써 둔다. store는 그것을 옮기기만 한다(값을 바꾸지 않음).</text>
<text x="40.0" y="516.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" xml:space="preserve">• 한 행 x_size entry가 burst 하나. 출력 tile의 행마다 명령 하나를 쓰는 경우(vtalib의 outDummyW 경로)는 명령 수가 많아진다.</text>
<text x="24.0" y="38.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#222222" xml:space="preserve">systolic EVTA 9. store: HLS EVTA와 같다 (out_mem 포트 A 쪽이 gemm_sa / compute mux)</text>
<rect x="30.0" y="646.0" width="1400.0" height="90.0" rx="6" fill="#dcefd6" stroke="#3c8a35" stroke-width="1.4"/>
<text x="46.0" y="670.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#222222" xml:space="preserve">바뀐 것</text>
<text x="46.0" y="689.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" xml:space="preserve">• store.vta.cc 코드는 그대로. out_mem 포트 A(쓰는 쪽)는 gemm_sa_bd의 mux: GEMM 단계는 gemm_sa, ALU는 compute.</text>
<text x="46.0" y="708.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222222" xml:space="preserve">• DRAM 쓰기(m_axi data_port)는 smartconnect에서 333 MHz HP 클럭으로 넘어간다(HP 포트 한계 때문에 EVTA 400 MHz와 분리).</text>
</svg>
