</defs>
<rect x="0" y="0" width="1460" height="750" fill="#ffffff" stroke="none"/>

<text x="24.0" y="64.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#444444" xml:space="preserve">AUTORESTART: 한 번 = store_queue의 명령 하나. pop_prev_dep면 g2s token(compute가 out을 다 씀)을 먼저 꺼내고, 끝나면 push_prev_dep면 s2g</text>
<text x="24.0" y="84.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#444444" xml:space="preserve">(store가 out을 다 읽어 compute가 덮어써도 됨). DRAM 쓰기는 m_axi data_port(128비트) burst. pad는 없다.</text>
<rect x="40.0" y="150.0" width="160.0" height="32.0" rx="3" fill="#fff3c4" stroke="#9a7b00" stroke-width="1.3"/>
<line x1="66.7" y1="153.0" x2="66.7" y2="179.0" stroke="#9a7b00" stroke-width="0.6"/>
