<line x1="120.0" y1="343.0" x2="120.0" y2="365.0" stroke="#9a7b00" stroke-width="0.6"/>
<line x1="140.0" y1="343.0" x2="140.0" y2="365.0" stroke="#9a7b00" stroke-width="0.6"/>
<text x="100.0" y="334.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#222222" xml:space="preserve">s2g_queue</text>
<text x="100.0" y="381.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555" xml:space="preserve">push_prev_dep면 넣음</text>
