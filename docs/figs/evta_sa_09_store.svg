<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="750" viewBox="0 0 1460 750" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title>HLS EVTA 5. store: out_mem의 2D 영역을 DRAM으로 (vta.cc store())</title>
