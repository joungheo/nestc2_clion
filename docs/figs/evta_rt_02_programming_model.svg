<text x="695.0" y="501.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">2048 × 256 B (multi 1024)</text>
<rect x="830.0" y="370.0" width="150.0" height="70.0" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
<text x="905.0" y="401.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">acc SRAM (int32)</text>
<text x="905.0" y="416.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">4096 × 64 B (multi 2048)</text>
<rect x="830.0" y="455.0" width="150.0" height="70.0" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
<text x="905.0" y="486.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">uop SRAM</text>
<text x="905.0" y="501.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">64 KB</text>
<rect x="1030.0" y="370.0" width="150.0" height="70.0" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
<text x="1105.0" y="401.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">out SRAM (int8)</text>
<text x="1105.0" y="416.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">acc를 줄인 값</text>
