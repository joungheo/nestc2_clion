</defs>
<rect x="0.0" y="0.0" width="1240.0" height="820.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
<text x="24.0" y="38.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#222222" xml:space="preserve">그림 2. runtime이 다루는 EVTA 프로그래밍 모델 (원래 VTA의 decoupled access-execute)</text>
<text x="24.0" y="64.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" text-anchor="start" font-weight="normal" fill="#444444" xml:space="preserve">CPU는 DRAM에 명령 열을 쓰고 fetch에게 주소와 개수만 알려준다. 모듈 넷은 따로 돌고 token으로만 순서를 맞춘다.</text>
<rect x="40.0" y="100.0" width="300.0" height="150.0" rx="6" fill="#fde5cc" stroke="#c06a10" stroke-width="1.4"/>
<text x="48.0" y="145.6" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" text-anchor="left" font-weight="bold" fill="#111111" xml:space="preserve">CPU (A53, vtalib)</text>
<text x="48.0" y="162.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">① 명령·uop를 CMA에 씀</text>
<text x="48.0" y="179.4" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">② cache flush (+ dsb)</text>
<text x="48.0" y="196.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">③ 레지스터: insn 주소·개수, START</text>
<text x="48.0" y="213.1" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">④ compute의 done을 폴링</text>
<rect x="380.0" y="90.0" width="820.0" height="520.0" rx="8" fill="#f7f9fc" stroke="#2f5f98" stroke-width="1.4"/>
<text x="394.0" y="112.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#2f5f98" xml:space="preserve">EVTA (하나, 레지스터 0xA0000000 + i·0x10000)</text>
<rect x="410.0" y="130.0" width="170.0" height="80.0" rx="6" fill="#ece2f4" stroke="#6d4596" stroke-width="1.4"/>
<text x="495.0" y="157.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">fetch</text>
<text x="495.0" y="174.4" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">명령을 읽어</text>
<text x="495.0" y="191.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">종류별 큐로</text>
<line x1="342.0" y1="170.0" x2="406.0" y2="170.0" stroke="#c06a10" stroke-width="1.6" marker-end="url(#aro)"/>
