<rect x="620.0" y="250.0" width="150.0" height="80.0" rx="6" fill="#ece2f4" stroke="#6d4596" stroke-width="1.4"/>
<text x="695.0" y="277.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">load</text>
<text x="695.0" y="294.4" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">DRAM → SRAM</text>
<text x="695.0" y="311.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">(pad 0 채움)</text>
