<path d="M905,140 L905,156" fill="none" stroke="#2f5f98" stroke-width="1.4" marker-end="url(#arb)"/>
<rect x="620.0" y="370.0" width="150.0" height="70.0" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
<text x="695.0" y="401.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">inp SRAM</text>
<text x="695.0" y="416.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">4096 × 16 B (multi 2048)</text>
<rect x="620.0" y="455.0" width="150.0" height="70.0" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
