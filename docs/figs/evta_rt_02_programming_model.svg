<line x1="772.0" y1="490.0" x2="826.0" y2="415.0" stroke="#333333" stroke-width="1.6" marker-end="url(#ara)"/>
<line x1="982.0" y1="405.0" x2="1026.0" y2="405.0" stroke="#333333" stroke-width="1.6" marker-end="url(#ara)"/>
<line x1="1105.0" y1="366.0" x2="1105.0" y2="334.0" stroke="#333333" stroke-width="1.6" marker-end="url(#ara)"/>
<rect x="410.0" y="545.0" width="770.0" height="50.0" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.4"/>
<text x="795.0" y="566.1" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">dependence token 큐 (VTADepPush / VTADepPop)</text>
<text x="795.0" y="582.3" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">load→compute: 데이터 도착 (RAW)   compute→load: SRAM 반쪽이 비었음 (WAR)   compute→store, store→compute</text>
<rect x="40.0" y="640.0" width="1160.0" height="120.0" rx="6" fill="#efe6d6" stroke="#8a6d3b" stroke-width="1.4"/>
<text x="48.0" y="679.1" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" text-anchor="left" font-weight="bold" fill="#111111" xml:space="preserve">DRAM (CMA, 물리 연속)</text>
<text x="48.0" y="695.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">명령 열 (256비트 × N, 끝은 FINISH)  ·  uop 열 (GEMM/ALU 루프 몸통)  ·  inp (int8, N·C/16·H·W·16)  ·  wgt (int8 16×16 블록)</text>
<text x="48.0" y="712.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">bias (int32, acc로 LOAD)  ·  out (int8, inp와 같은 layout)</text>
<text x="48.0" y="729.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">주소는 명령 안에 물리 주소로 들어간다 (base 레지스터는 모두 0). CPU 쪽 cache와 일관성 없음 → flush / invalidate.</text>
<path d="M495,636 L495,214" fill="none" stroke="#888888" stroke-width="1.4" marker-end="url(#ark)" stroke-dasharray="5,4"/>
<text x="502.0" y="600.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#666666" xml:space="preserve">명령 읽기</text>
<path d="M700,636 L700,620 L600,620 L600,300 L616,300" fill="none" stroke="#888888" stroke-width="1.4" marker-end="url(#ark)" stroke-dasharray="5,4"/>
<text x="606.0" y="632.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#666666" xml:space="preserve">inp·wgt·bias·uop</text>
<path d="M1185,290 L1215,290 L1215,700 L1204,700" fill="none" stroke="#888888" stroke-width="1.4" marker-end="url(#ark)" stroke-dasharray="5,4"/>
<text x="1140.0" y="632.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#666666" xml:space="preserve">out 쓰기</text>
<path d="M190,252 L190,636" fill="none" stroke="#c06a10" stroke-width="1.4" marker-end="url(#aro)"/>
<text x="198.0" y="450.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#c06a10" xml:space="preserve">① ②</text>
<text x="40.0" y="790.0" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="start" font-weight="normal" fill="#444444" xml:space="preserve">명령 종류: LOAD / STORE / GEMM / ALU / FINISH (256비트, docs/evta_isa_ext.md). GEMM·ALU 명령은 uop 범위와 2중 루프를 가진다.</text>
