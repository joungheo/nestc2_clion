<line x1="695.0" y1="196.0" x2="695.0" y2="246.0" stroke="#2f5f98" stroke-width="1.6" marker-end="url(#arb)"/>
<rect x="830.0" y="250.0" width="150.0" height="80.0" rx="6" fill="#ece2f4" stroke="#6d4596" stroke-width="1.4"/>
<text x="905.0" y="277.5" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">compute</text>
<text x="905.0" y="294.4" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">GEMM 16×16</text>
<text x="905.0" y="311.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">ALU MIN MAX ADD SHR</text>
<rect x="850.0" y="160.0" width="110.0" height="34.0" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
<text x="905.0" y="181.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">compute 큐</text>
<line x1="905.0" y1="196.0" x2="905.0" y2="246.0" stroke="#2f5f98" stroke-width="1.6" marker-end="url(#arb)"/>
<rect x="1030.0" y="250.0" width="150.0" height="80.0" rx="6" fill="#ece2f4" stroke="#6d4596" stroke-width="1.4"/>
<text x="1105.0" y="285.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#111111" xml:space="preserve">store</text>
<text x="1105.0" y="302.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">SRAM → DRAM</text>
<rect x="1050.0" y="160.0" width="110.0" height="34.0" rx="6" fill="#eeeeee" stroke="#777777" stroke-width="1.4"/>
<text x="1105.0" y="181.2" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#111111" xml:space="preserve">store 큐</text>
<line x1="1105.0" y1="196.0" x2="1105.0" y2="246.0" stroke="#2f5f98" stroke-width="1.6" marker-end="url(#arb)"/>
