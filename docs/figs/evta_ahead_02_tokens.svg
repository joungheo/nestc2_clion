<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title>그림 A2. EVTA의 세 모듈과 토큰: 토큰에는 이름이 없고, n번째 pop은 n번째 push를 받는다</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f98"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c06a10"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c8a35"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d4596"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a7b00"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker></defs>
<rect x="0" y="0" width="1400" height="640" fill="#ffffff"/>
<text x="700.0" y="34" font-size="19" fill="#333333" text-anchor="middle" font-weight="bold">그림 A2. EVTA의 세 모듈과 토큰: 토큰에는 이름이 없고, n번째 pop은 n번째 push를 받는다</text>
<rect x="60" y="200" width="260" height="150" rx="6" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="190.0" y="260.0" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">load 모듈 (큐 1)</text>
<text x="190.0" y="280.25" font-size="15" fill="#333333" text-anchor="middle" font-weight="normal">DRAM → inp / wgt</text>
<text x="190.0" y="300.5" font-size="15" fill="#333333" text-anchor="middle" font-weight="normal">LOAD</text>
<rect x="570" y="200" width="260" height="150" rx="6" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="700.0" y="260.0" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">compute 모듈 (큐 2)</text>
<text x="700.0" y="280.25" font-size="15" fill="#333333" text-anchor="middle" font-weight="normal">GEMM, ALU</text>
<text x="700.0" y="300.5" font-size="15" fill="#333333" text-anchor="middle" font-weight="normal">acc / uop LOAD도 여기</text>
<rect x="1080" y="200" width="260" height="150" rx="6" fill="#f1eaf8" stroke="#6d4596" stroke-width="1.6"/>
<text x="1210.0" y="260.0" font-size="15" fill="#333333" text-anchor="middle" font-weight="bold">store 모듈 (큐 3)</text>
<text x="1210.0" y="280.25" font-size="15" fill="#333333" text-anchor="middle" font-weight="normal">out → DRAM</text>
<text x="1210.0" y="300.5" font-size="15" fill="#333333" text-anchor="middle" font-weight="normal">STORE</text>
<polyline points="320,240 570,240" fill="none" stroke="#c06a10" stroke-width="2.4" marker-end="url(#ao)"/>
<text x="445" y="228" font-size="13" fill="#c06a10" text-anchor="middle" font-weight="normal">l2g: &quot;다 실었다&quot;</text>
<text x="445" y="262" font-size="12" fill="#888888" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">VTADepPush(1, 2) / Pop(1, 2)</text>
<polyline points="570,310 320,310" fill="none" stroke="#2f5f98" stroke-width="2.4" marker-end="url(#ab)"/>
<text x="445" y="298" font-size="13" fill="#2f5f98" text-anchor="middle" font-weight="normal">g2l: &quot;다 썼다 (덮어써도 됨)&quot;</text>
<text x="445" y="332" font-size="12" fill="#888888" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">VTADepPush(2, 1) / Pop(2, 1)</text>
<polyline points="830,240 1080,240" fill="none" stroke="#2f5f98" stroke-width="2.4" marker-end="url(#ab)"/>
<text x="955" y="228" font-size="13" fill="#2f5f98" text-anchor="middle" font-weight="normal">g2s: &quot;계산 끝, 내보내라&quot;</text>
<text x="955" y="262" font-size="12" fill="#888888" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">VTADepPush(2, 3) / Pop(2, 3)</text>
<polyline points="1080,310 830,310" fill="none" stroke="#6d4596" stroke-width="2.4" marker-end="url(#ap)"/>
<text x="955" y="298" font-size="13" fill="#6d4596" text-anchor="middle" font-weight="normal">s2g: &quot;다 내보냄 (out 재사용)&quot;</text>
<text x="955" y="332" font-size="12" fill="#888888" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">VTADepPush(3, 2) / Pop(3, 2)</text>
<rect x="60" y="80" width="1280" height="90" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="80" y="108" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">fetch 모듈이 DRAM의 명령열(VTAGenericInsn, 256 bit)을 읽어 명령마다 그 모듈의 큐로 보낸다. 세 모듈은 동시에 돈다.</text>
<text x="80" y="132" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">명령마다 플래그 4개: pop_prev / pop_next (실행 전에 이웃 모듈의 토큰을 하나 꺼냄, 없으면 기다림),</text>
<text x="80" y="156" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">push_prev / push_next (실행 후 이웃 모듈에 토큰 하나). 토큰 큐는 개수만 센다 (FIFO, 하드웨어 세마포어).</text>
<rect x="60" y="390" width="1280" height="220" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="80" y="418" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">vtalib에서 쓰는 법 (VTADepPush(from, to) / VTADepPop(from, to); 1 = load, 2 = compute, 3 = store)</text>
<text x="80" y="450" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">VTADepPush(vtaCmdH, 2, 1);   // compute의 마지막 명령에 push_prev를 켠다 (그 명령이 끝나면 load에게 토큰)</text>
<text x="80" y="475" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">VTADepPop(vtaCmdH, 2, 1);    // 다음에 만들 load 명령에 pop_next를 켠다 (토큰이 올 때까지 그 LOAD는 기다림)</text>
<text x="80" y="500" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">                             // 같은 큐에 pop이 두 번 연속이면 첫 번째는 빈 명령(NOP)에 실린다</text>
<text x="80" y="525" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">규칙 1. 각 큐 쌍에서 pop 순서 = push 순서. k번째 pop은 &quot;k번째 push가 가리키는 일&quot;이 끝났다는 뜻이다.</text>
<text x="80" y="550" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">규칙 2. run 하나에서 push 수 = pop 수 (남으면 다음 run의 첫 pop이 엉뚱한 토큰을 받는다).</text>
<text x="80" y="575" font-size="13" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">규칙 3. pop이 기다리는 push는 명령열에서 그 pop보다 앞에 있어야 한다 (뒤에 있으면 fetch가 막혀 멈춘다).</text>
</svg>
