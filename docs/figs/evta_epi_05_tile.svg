<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title>그림 E5. 타일 하나에서 나가는 명령: 모듈별 시간 흐름과 두 가지 ADD 경로</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f98"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c06a10"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c8a35"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d4596"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a7b00"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker></defs>
<rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
<text x="700.0" y="34" font-size="19" fill="#333333" text-anchor="middle" font-weight="bold">그림 E5. 타일 하나에서 나가는 명령: 모듈별 시간 흐름과 두 가지 ADD 경로</text>
<text x="40" y="150" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">load</text>
<line x1="140" y1="180" x2="1360" y2="180" stroke="#888888" stroke-width="1"/>
<text x="40" y="250" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">compute</text>
<line x1="140" y1="280" x2="1360" y2="280" stroke="#888888" stroke-width="1"/>
<text x="40" y="350" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">store</text>
<line x1="140" y1="380" x2="1360" y2="380" stroke="#888888" stroke-width="1"/>
<rect x="150" y="120" width="150" height="50" rx="3" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="225.0" y="149.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">입력·weight LOAD</text>
<rect x="330" y="220" width="260" height="50" rx="3" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="460.0" y="249.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">GEMM: acc X = Σ in·w + bias</text>
<rect x="610" y="120" width="140" height="50" rx="3" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="680.0" y="149.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">residual LOAD</text>
<rect x="610" y="220" width="180" height="50" rx="3" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="700.0" y="241.1" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">conv rq: SHR, MAX, MIN</text>
<text x="700.0" y="257.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">→ X = int8 conv 값</text>
<rect x="810" y="220" width="70" height="50" rx="3" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="845.0" y="249.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">(대기)</text>
<rect x="900" y="220" width="230" height="50" rx="3" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="1015.0" y="241.1" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">epilogue ADD 경로</text>
<text x="1015.0" y="257.3" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">(아래 a 또는 b)</text>
<rect x="1170" y="320" width="120" height="50" rx="3" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="1230.0" y="349.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal">STORE X</text>
<polyline points="300,160 330,230" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="318" y="205" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal">토큰</text>
<polyline points="590,230 610,160" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="585" y="190" font-size="11" fill="#c0392b" text-anchor="end" font-weight="normal">&quot;inp 비었음&quot;</text>
<polyline points="750,160 900,228" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="800" y="160" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal">&quot;residual 있음&quot;</text>
<polyline points="1130,250 1170,330" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="1160" y="290" font-size="11" fill="#c0392b" text-anchor="start" font-weight="normal">토큰</text>
<text x="700" y="410" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal">빨간 화살표 = 모듈 사이 의존 토큰 (fetch가 모든 명령을 미리 나눠 주고, 모듈은 토큰이 올 때까지 기다린다)</text>
<rect x="40" y="450" width="650" height="400" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="60" y="480" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">(a) shift add — Resnet, MobileNetV2 (scale 비 2^k)</text>
<text x="70" y="525" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">X &lt;&lt;= shlV</text>
<text x="400" y="525" font-size="14" fill="#3c8a35" text-anchor="start" font-weight="normal">ALU SHR −shlV</text>
<text x="70" y="569" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">X += residual · 2^shlT·I</text>
<text x="400" y="569" font-size="14" fill="#3c8a35" text-anchor="start" font-weight="normal">GEMM (identity weight)</text>
<text x="70" y="613" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">rq(round 2, shift m, clip)</text>
<text x="400" y="613" font-size="14" fill="#3c8a35" text-anchor="start" font-weight="normal">GEMM이 쓸 때 바로</text>
<text x="70" y="657" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">[f2: CLIP / SHL / LUT]</text>
<text x="400" y="657" font-size="14" fill="#3c8a35" text-anchor="start" font-weight="normal">ALU</text>
<text x="70" y="720" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">• weight가 int8이라 residual에는 2^k (≤ 64)만 곱할 수 있다</text>
<text x="70" y="746" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">• ALU 확장 없이도 된다 (확장 전부터 있던 길)</text>
<text x="70" y="772" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">• Resnet18 8개, Resnet50 16개, MobileNetV2 10개 conv</text>
<rect x="710" y="450" width="650" height="400" rx="6" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="730" y="480" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">(b) MUL add — DeiT out-proj / fc2 (scale 비 임의, 11-15)</text>
<text x="740" y="525" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">reset Y; Y += residual·I</text>
<text x="1010" y="525" font-size="14" fill="#c06a10" text-anchor="start" font-weight="normal">GEMM</text>
<text x="740" y="569" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">Y = Y × mulT (20107)</text>
<text x="1010" y="569" font-size="14" fill="#c06a10" text-anchor="start" font-weight="normal">ALU MUL</text>
<text x="740" y="613" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">X = X × mulV (5762) + Y</text>
<text x="1010" y="613" font-size="14" fill="#c06a10" text-anchor="start" font-weight="normal">ALU MADD + rq(round 2, &gt;&gt;14)</text>
<text x="740" y="657" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve"></text>
<text x="1010" y="657" font-size="14" fill="#c06a10" text-anchor="start" font-weight="normal">(_alux: MUL X, ADD X += Y)</text>
<text x="740" y="700" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">• 20107처럼 큰 배율은 ALU MUL(16비트 상수)이 필요 →</text>
<text x="740" y="726" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">  residual이 acc에 따로 있어야 한다 (Y)</text>
<text x="740" y="752" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">• 결과 바이트는 elemadd_evta와 같다</text>
<text x="740" y="778" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">• 하지만 대기 + ALU 5 pass가 겹치지 않아 더 느림 → 기본 꺼짐</text>
</svg>
