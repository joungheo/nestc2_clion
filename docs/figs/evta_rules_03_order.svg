<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title>그림 R3. finder 순서와 tailFree: 먼저 준 꼬리가 이긴다</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f98"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c06a10"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c8a35"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d4596"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a7b00"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker></defs>
<rect x="0" y="0" width="1400" height="540" fill="#ffffff"/>
<text x="700.0" y="34" font-size="19" fill="#333333" text-anchor="middle" font-weight="bold">그림 R3. finder 순서와 tailFree: 먼저 준 꼬리가 이긴다</text>
<rect x="40" y="150" width="118" height="64" rx="6" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="99.0" y="186.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">Residual</text>
<rect x="44" y="250" width="110" height="34" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="99.0" y="271.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">fusions</text>
<polyline points="99.0,214 99.0,250" fill="none" stroke="#3c8a35" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="172" y="150" width="118" height="64" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="231.0" y="186.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">EvtaMaxPools</text>
<polyline points="158,182 172,182" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ak)"/>
<rect x="304" y="150" width="118" height="64" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="363.0" y="177.775" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">InputPre-</text>
<text x="363.0" y="195.32500000000002" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">process</text>
<polyline points="290,182 304,182" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ak)"/>
<rect x="436" y="150" width="118" height="64" rx="6" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="495.0" y="186.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">Pool</text>
<polyline points="422,182 436,182" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ak)"/>
<rect x="440" y="250" width="110" height="34" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="495.0" y="271.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">poolFusions</text>
<polyline points="495.0,214 495.0,250" fill="none" stroke="#3c8a35" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="568" y="150" width="118" height="64" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="627.0" y="186.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">LutRegions</text>
<polyline points="554,182 568,182" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ak)"/>
<rect x="700" y="150" width="118" height="64" rx="6" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="759.0" y="186.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">OutLutConvs</text>
<polyline points="686,182 700,182" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ak)"/>
<rect x="704" y="250" width="110" height="34" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="759.0" y="271.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">outLutConv</text>
<polyline points="759.0,214 759.0,250" fill="none" stroke="#3c8a35" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="832" y="150" width="118" height="64" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="891.0" y="177.775" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">… OutLut-</text>
<text x="891.0" y="195.32500000000002" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">MatMuls</text>
<polyline points="818,182 832,182" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ak)"/>
<rect x="964" y="150" width="118" height="64" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
<text x="1023.0" y="186.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">PackedRows</text>
<polyline points="950,182 964,182" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ak)"/>
<rect x="1096" y="150" width="118" height="64" rx="6" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="1155.0" y="186.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">MulResidual</text>
<polyline points="1082,182 1096,182" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ak)"/>
<rect x="1100" y="250" width="110" height="34" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="1155.0" y="271.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">fusions</text>
<polyline points="1155.0,214 1155.0,250" fill="none" stroke="#3c8a35" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="1228" y="150" width="118" height="64" rx="6" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="1287.0" y="186.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">Embed</text>
<polyline points="1214,182 1228,182" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ak)"/>
<rect x="1232" y="250" width="110" height="34" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="1287.0" y="271.2" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">fusions</text>
<polyline points="1287.0,214 1287.0,250" fill="none" stroke="#3c8a35" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="40" y="76" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">VTA::save가 부르는 순서 (파랑 = 꼬리를 주는 finder, 초록 = 그 finder가 쓰는 기록)</text>
<polyline points="495.0,150 495.0,122 759.0,122 759.0,146" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ar)"/>
<text x="627.0" y="115" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">전: Pool이 outLutConv를 봤지만 아직 비어 있다</text>
<rect x="40" y="330" width="640" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="60" y="360" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">tailFree(I) = !fusions.count(I) &amp;&amp; !poolFusions.count(I)</text>
<text x="60" y="382" font-size="14" fill="#333333" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">                &amp;&amp; !outLutConv.count(I)</text>
<text x="60" y="420.0" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">• 꼬리는 생산자마다 하나 (tile의 STORE 앞 자리가 하나).</text>
<text x="60" y="438.9" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">• 뒤 finder는 앞 finder가 준 꼬리를 보고 건너뛴다.</text>
<text x="60" y="457.8" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">• 순서가 바뀌어도 &quot;하나만&quot;은 지켜진다.</text>
<rect x="720" y="330" width="640" height="180" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="740" y="360" font-size="14" fill="#333333" text-anchor="start" font-weight="bold">예: DeiT fc1 (1x1 conv) 뒤의 GELU 표</text>
<text x="740" y="392" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">Residual: fc1 뒤가 add가 아님 → 꼬리 없음</text>
<text x="740" y="418" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">Pool: pool 아님 → 없음</text>
<text x="740" y="444" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">OutLutConvs: canTail(fc1, OUT_LUT) ✔ → outLutConv[fc1]</text>
<text x="740" y="470" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">MulResidual / Embed: tailFree(fc1) = false → 건너뜀</text>
</svg>
