<text x="185.0" y="356.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">findEmbedFusions</text>
<rect x="330" y="334" width="310" height="36" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="485.0" y="356.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">VTA 또는 FirstBNN</text>
<rect x="640" y="334" width="120" height="36" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
