<text x="185.0" y="396.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">findAttnKeepLayout</text>
<rect x="330" y="374" width="310" height="36" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="485.0" y="396.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">ConvPath::VTA</text>
<rect x="640" y="374" width="120" height="36" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="700.0" y="396.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">✔</text>
<rect x="760" y="374" width="120" height="36" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.6"/>
<text x="820.0" y="396.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">–</text>
<rect x="880" y="374" width="120" height="36" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.6"/>
<text x="940.0" y="396.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">✔</text>
<text x="1020" y="160" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">✔ = 확인함, – = 확인 안 함</text>
<text x="1020" y="196" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">빨강 = 틀리거나 빠진 확인</text>
<text x="1020" y="232.0" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">✔*: outLutConv는 findOutLutConvs가 채우는데</text>
<text x="1020" y="249.55" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">그 finder가 Pool보다 뒤에 돈다.</text>
<text x="1020" y="267.1" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">확인할 때 늘 비어 있다 (효과 없음).</text>
<text x="1020" y="310.0" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">첫 conv: 아무 확인도 없다.</text>
<text x="1020" y="327.55" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">2x2 pool은 아예 볼 수 없었다</text>
<text x="1020" y="345.1" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">(kk != 3이면 버림: VGG16 pool 놓침).</text>
<text x="1020" y="388.0" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">AttnKeepLayout: pool 꼬리를 안 봄</text>
<text x="1020" y="405.55" font-size="13" fill="#333333" text-anchor="start" font-weight="normal">(DeiT에는 pool이 없어 드러나지 않았다).</text>
<text x="40" y="450" font-size="16" fill="#333333" text-anchor="start" font-weight="bold">② 후: 모든 finder가 같은 한 줄을 묻는다</text>
<rect x="40" y="468" width="1320" height="92" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="700" y="502" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" xml:space="preserve">canTail(I, TAIL_x, ctx)  =  (evtaTails(evtaGemmOf(I)) &amp; TAIL_x)  &amp;&amp;  ctx-&gt;tailFree(I)</text>
<text x="700" y="538" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">어떤 생산자인가 → 그 호출이 이 꼬리를 하나 → 아직 꼬리가 없나 (fusions · poolFusions · outLutConv 세 기록 모두 빔)</text>
<text x="700" y="600" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">꼬리마다 다른 조건 (scale, 모양, tile, relu)은 각 finder에 그대로 남는다. 다섯 모델 번들은 바이트까지 같다.</text>
</svg>
