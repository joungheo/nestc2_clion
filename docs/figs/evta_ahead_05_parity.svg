<text x="60" y="566" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">입력 k+1 c=0 → A: A를 마지막으로 읽은 것은 GEMM k c=11 (t0, t1). GEMM k c=12 t0의 토큰이 오면 둘 다 끝났다.</text>
<text x="60" y="592" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">블록 수가 짝수면 전과 같은 배치다. run의 첫 group은 전처럼 B에서 시작한다.</text>
<text x="60" y="618" font-size="14" fill="#333333" text-anchor="start" font-weight="normal">uint32_t inputSramPtr = tokIn ? 0 : gAhead.inpPtr;   …   gAhead.inpPtr = inputSramPtr;</text>
