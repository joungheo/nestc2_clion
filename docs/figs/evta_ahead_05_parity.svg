<polyline points="360,320 365,336" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="600" y="400" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal">DeiT A x V (K 198 → 13 블록): 출력 783 / 12672 바이트가 달라짐, confidence 0.738 → 0.735. 시뮬레이터에서는 안 드러남</text>
