<text x="700" y="480" font-size="14" fill="#888888" text-anchor="middle" font-weight="normal">CPU 경로 = 보통 conv + VTAEpilogueRef (같은 정수 식) → 어느 길로 가도 출력 바이트가 같다 (EVTA_EPI_CHECK=1로 확인)</text>
