<rect x="0" y="0" width="1480" height="640" fill="#ffffff"/>
<text x="740" y="34" font-size="19" fill="#333333" text-anchor="middle" font-weight="bold">그림 A4. 파이프라인이 깊으면 앞 step의 쓰기가 늦게 끝난다 — 읽기 직전 31 slot 안에 쓴 값은 못 본다 (cosim으로 잼)</text>
