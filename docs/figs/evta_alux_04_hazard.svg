<text x="878.0" y="78" font-size="10" fill="#888888" text-anchor="middle" font-weight="normal">20</text>
<text x="914.0" y="78" font-size="10" fill="#888888" text-anchor="middle" font-weight="normal">21</text>
<text x="950.0" y="78" font-size="10" fill="#888888" text-anchor="middle" font-weight="normal">22</text>
<text x="986.0" y="78" font-size="10" fill="#888888" text-anchor="middle" font-weight="normal">23</text>
