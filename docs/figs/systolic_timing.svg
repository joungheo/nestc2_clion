<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="'Noto Sans CJK KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12">
<title>Systolic GEMM: weight switch timing</title>
<rect x="0" y="0" width="1040" height="560" fill="white"/>
<text x="20" y="26" font-size="16" font-weight="bold">그림 3. weight 교체 타이밍 (F = 채우기 시작, T = 새 weight를 쓰는 첫 issue, 최소 T = F+16)</text>
<text x="20" y="46" fill="#555">시각은 PE(0,0) 기준 클럭(상수 지연 생략). F = 0, T = 16, 다음 채우기 F′ = T = 16인 경우(weight 주기 16).</text>
<line x1="220" y1="80" x2="220" y2="500" stroke="#eee"/>
<text x="214" y="74" font-size="10" fill="#777">0</text>
<line x1="250" y1="80" x2="250" y2="500" stroke="#eee"/>
<line x1="280" y1="80" x2="280" y2="500" stroke="#eee"/>
<text x="274" y="74" font-size="10" fill="#777">4</text>
<line x1="310" y1="80" x2="310" y2="500" stroke="#eee"/>
<line x1="340" y1="80" x2="340" y2="500" stroke="#eee"/>
<text x="334" y="74" font-size="10" fill="#777">8</text>
<line x1="370" y1="80" x2="370" y2="500" stroke="#eee"/>
<line x1="400" y1="80" x2="400" y2="500" stroke="#eee"/>
<text x="394" y="74" font-size="10" fill="#777">12</text>
<line x1="430" y1="80" x2="430" y2="500" stroke="#eee"/>
<line x1="460" y1="80" x2="460" y2="500" stroke="#eee"/>
<text x="454" y="74" font-size="10" fill="#777">16</text>
<line x1="490" y1="80" x2="490" y2="500" stroke="#eee"/>
<line x1="520" y1="80" x2="520" y2="500" stroke="#eee"/>
<text x="514" y="74" font-size="10" fill="#777">20</text>
<line x1="550" y1="80" x2="550" y2="500" stroke="#eee"/>
<line x1="580" y1="80" x2="580" y2="500" stroke="#eee"/>
<text x="574" y="74" font-size="10" fill="#777">24</text>
<line x1="610" y1="80" x2="610" y2="500" stroke="#eee"/>
<line x1="640" y1="80" x2="640" y2="500" stroke="#eee"/>
<text x="634" y="74" font-size="10" fill="#777">28</text>
<line x1="670" y1="80" x2="670" y2="500" stroke="#eee"/>
<line x1="700" y1="80" x2="700" y2="500" stroke="#eee"/>
<text x="694" y="74" font-size="10" fill="#777">32</text>
<line x1="730" y1="80" x2="730" y2="500" stroke="#eee"/>
<line x1="760" y1="80" x2="760" y2="500" stroke="#eee"/>
<text x="754" y="74" font-size="10" fill="#777">36</text>
<line x1="790" y1="80" x2="790" y2="500" stroke="#eee"/>
<line x1="820" y1="80" x2="820" y2="500" stroke="#eee"/>
<text x="814" y="74" font-size="10" fill="#777">40</text>
<line x1="850" y1="80" x2="850" y2="500" stroke="#eee"/>
<line x1="880" y1="80" x2="880" y2="500" stroke="#eee"/>
<text x="874" y="74" font-size="10" fill="#777">44</text>
<line x1="910" y1="80" x2="910" y2="500" stroke="#eee"/>
<line x1="940" y1="80" x2="940" y2="500" stroke="#eee"/>
<text x="934" y="74" font-size="10" fill="#777">48</text>
<line x1="970" y1="80" x2="970" y2="500" stroke="#eee"/>
<line x1="1000" y1="80" x2="1000" y2="500" stroke="#eee"/>
<text x="994" y="74" font-size="10" fill="#777">52</text>
<line x1="220" y1="80" x2="220" y2="500" stroke="#999" stroke-dasharray="4 3"/><text x="223" y="515" font-size="11" fill="#333">F</text>
<line x1="460" y1="80" x2="460" y2="500" stroke="#999" stroke-dasharray="4 3"/><text x="463" y="515" font-size="11" fill="#333">T = F′</text>
<line x1="700" y1="80" x2="700" y2="500" stroke="#999" stroke-dasharray="4 3"/><text x="703" y="515" font-size="11" fill="#333">T′</text>
<text x="20" y="113">PISO 0 (열 0) shift</text>
<rect x="220" y="100" width="240" height="18" fill="#9fd59f" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<text x="223" y="113" font-size="10">w[0][15] … w[0][0]</text>
<rect x="460" y="100" width="240" height="18" fill="#d6eed6" fill-opacity="1.0" stroke="#555" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="463" y="113" font-size="10">다음 블록</text>
<text x="20" y="147">PISO 15 (열 15) shift</text>
<rect x="445" y="134" width="240" height="18" fill="#9fd59f" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<text x="448" y="147" font-size="10">w[15][15] … w[15][0]</text>
<rect x="685" y="134" width="240" height="18" fill="#d6eed6" fill-opacity="1.0" stroke="#555" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="688" y="147" font-size="10">다음 블록</text>
<text x="20" y="181">PE(0,0)  CEB1 / CEB2</text>
<rect x="220" y="168" width="240" height="18" fill="#9fd59f" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<text x="223" y="181" font-size="10">CEB1 [F, F+15]</text>
<rect x="460" y="168" width="240" height="18" fill="#d6eed6" fill-opacity="1.0" stroke="#555" stroke-width="0.5" stroke-dasharray="3 2"/><text x="530" y="181" font-size="10">다음 CEB1 [F′, F′+15]</text><line x1="460" y1="165" x2="460" y2="189" stroke="#b8501f" stroke-width="3"/><text x="464" y="181" font-size="10" fill="#b8501f">CEB2 @T</text>
<text x="20" y="215">PE(15,0)  CEB1 / CEB2</text>
<rect x="445" y="202" width="15" height="18" fill="#9fd59f" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<line x1="685" y1="199" x2="685" y2="223" stroke="#b8501f" stroke-width="3"/><text x="689" y="215" font-size="10" fill="#b8501f">CEB2 @T+15</text>
<text x="475" y="215" font-size="10">CEB1 [F+15, F+15] (한 클럭)</text>
<text x="20" y="249">PE(0,15)  CEB1 / CEB2</text>
<rect x="445" y="236" width="240" height="18" fill="#9fd59f" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<text x="448" y="249" font-size="10">CEB1 [F+15, F+30]</text>
<line x1="685" y1="233" x2="685" y2="257" stroke="#b8501f" stroke-width="3"/><text x="689" y="249" font-size="10" fill="#b8501f">CEB2 @T+15</text>
<text x="20" y="283">PE(15,15) CEB1 / CEB2</text>
<rect x="670" y="270" width="15" height="18" fill="#9fd59f" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<line x1="910" y1="267" x2="910" y2="291" stroke="#b8501f" stroke-width="3"/><text x="914" y="283" font-size="10" fill="#b8501f">CEB2 @T+30</text>
<text x="700" y="283" font-size="10">CEB1 [F+30]</text>
<text x="20" y="351">PE(0,0) 받는 픽셀</text>
<rect x="220" y="338" width="240" height="18" fill="#f3c6ad" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<text x="223" y="351" font-size="10">옛 weight의 픽셀</text>
<rect x="460" y="338" width="240" height="18" fill="#9dbbe6" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<text x="463" y="351" font-size="10">새 weight (T ≤ issue &lt; T′)</text><rect x="700" y="338" width="330" height="18" fill="#c9d9f2" stroke="#555" stroke-width="0.5"/><text x="703" y="351" font-size="10">그다음 weight (issue ≥ T′)</text>
<text x="20" y="385">PE(15,15) 받는 픽셀</text>
<rect x="220" y="372" width="690" height="18" fill="#f3c6ad" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<text x="223" y="385" font-size="10">옛 weight의 픽셀 (issue &lt; T, 30클럭 늦게 도착)</text>
<rect x="910" y="372" width="105" height="18" fill="#9dbbe6" fill-opacity="1.0" stroke="#555" stroke-width="0.5"/>
<text x="913" y="385" font-size="10">새</text>
<text x="20" y="419">열 j 출력 → deskew</text>
<text x="220" y="419" font-size="11">열 j의 합은 j클럭 늦게 나오고 deskew(15−j)로 맞춘다. 태그(dst)도 같은 깊이.</text>
<g font-size="11" fill="#333">
<text x="20" y="535">규칙: B1(i, j)는 [F+i+j, F+15+j]에만 shift(CEB1), B2(i, j)는 T+i+j에 B1을 받는다(CEB2). PISO는 깊은 행의 값(w[j][15])부터 넣는다.</text>
<text x="20" y="551">CEB1 시작을 i+j만큼 늦추지 않으면 아래 행이 B2로 넘기기 전에 B1이 덮인다 → 주기가 31로 늘어난다. 끝(F+15+j)은 열 안 모든 행이 같다. 한 열 비트 정확 모델: 주기 16·17·20 오류 0, 15는 7/128.</text>
</g></svg>