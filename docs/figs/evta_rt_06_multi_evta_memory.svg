<text x="48.0" y="659.1" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="bold" fill="#111111" xml:space="preserve">동시 실행이 느려지는 이유 (§7.19 ⑧)</text>
<text x="48.0" y="675.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">copy 0 혼자: multi4 bitstream의 HP register slice 때문에 single bitstream보다 +1.1 %.</text>
<text x="48.0" y="692.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">EVTA 둘이 같이: DDR 컨트롤러 공유로 copy마다 +0.9 ms (HP1+HP2는 같은 DDR 포트라 +1.25 ms). 대역폭이 아니라 지연.</text>
<text x="48.0" y="709.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">CPU 쪽: 폴링 thread 4개가 A53 4코어를 나눔 (OMP_NUM_THREADS=1 권장).</text>
