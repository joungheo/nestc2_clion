<text x="48.0" y="534.1" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="13.5" text-anchor="left" font-weight="bold" fill="#111111" xml:space="preserve">CMA 128 MB</text>
<text x="48.0" y="550.9" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">명령·uop 큐 4 × 8 MB = 32 MB   |   weight / bias: 같은 바이트면 copy들이 버퍼 하나를 공유 (VTAConstBufferAlloc, refcount)</text>
<text x="48.0" y="567.8" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">activation: copy마다 VTABufferAlloc (크기별 pool, 기본 32 MB까지 보관)   |   replay 사본: copy마다</text>
<text x="48.0" y="584.7" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="12.5" text-anchor="left" font-weight="normal" fill="#111111" xml:space="preserve">Resnet50 × 4: 공유 없이는 weight만 102 MB → 공유로 실행 중 여유 85 MB</text>
