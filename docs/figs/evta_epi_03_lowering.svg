<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="'Noto Sans CJK KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
<title>그림 E3. lowering: 어떤 단계 목록이든 표준형 하나로 줄이고, 단항 부분은 세 종류로 분류</title>
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f98"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c06a10"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c8a35"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d4596"/></marker><marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a7b00"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888888"/></marker></defs>
<rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>
<text x="700.0" y="34" font-size="19" fill="#333333" text-anchor="middle" font-weight="bold">그림 E3. lowering: 어떤 단계 목록이든 표준형 하나로 줄이고, 단항 부분은 세 종류로 분류</text>
<text x="40" y="84" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">단계 목록 (VTASave가 낸 것, 최대 8단계)</text>
<text x="40" y="118" font-size="13" fill="#888888" text-anchor="start" font-weight="normal">DeiT out-proj:</text>
<rect x="160" y="98" width="130" height="34" rx="6" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="225.0" y="119.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">MUL 5762</text>
<rect x="305" y="98" width="130" height="34" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="370.0" y="119.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">ADD d=20107</text>
<rect x="450" y="98" width="130" height="34" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="515.0" y="119.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">RQ 2,14</text>
<text x="40" y="168" font-size="13" fill="#888888" text-anchor="start" font-weight="normal">Resnet50 res2_0:</text>
<rect x="160" y="148" width="130" height="34" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="225.0" y="169.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">ADD 0,1,0</text>
<rect x="305" y="148" width="130" height="34" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="370.0" y="169.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">RQ 2,1</text>
<rect x="450" y="148" width="130" height="34" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="515.0" y="169.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">CLIP 0,127</text>
<rect x="595" y="148" width="130" height="34" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="660.0" y="169.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">SHL 1</text>
<rect x="740" y="148" width="130" height="34" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="805.0" y="169.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">CLIP -128,127</text>
<text x="40" y="218" font-size="13" fill="#888888" text-anchor="start" font-weight="normal">DeiT fc1:</text>
<rect x="160" y="198" width="130" height="34" rx="6" fill="#f1eaf8" stroke="#6d4596" stroke-width="1.6"/>
<text x="225.0" y="219.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">LUT 0 (GELU)</text>
<polyline points="700,245 700,285" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#ak)"/>
<text x="712" y="270" font-size="13" fill="#333333" text-anchor="start" font-weight="bold">lowerEpilogue</text>
<text x="40" y="316" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">표준형 (모든 목록이 이 꼴):</text>
<rect x="40" y="340" width="150" height="64" rx="6" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="115.0" y="376.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">conv int8 x</text>
<polyline points="190,372 220,372" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ak)"/>
<rect x="220" y="340" width="120" height="64" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="280.0" y="367.77500000000003" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">f1</text>
<text x="280.0" y="385.32500000000005" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">ADD 앞 단항</text>
<polyline points="340,372 370,372" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ak)"/>
<rect x="370" y="340" width="120" height="64" rx="6" fill="#fdf0e2" stroke="#c06a10" stroke-width="1.6"/>
<text x="430.0" y="367.77500000000003" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">× mulV</text>
<text x="430.0" y="385.32500000000005" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">MUL (새로)</text>
<polyline points="490,372 520,372" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ak)"/>
<rect x="520" y="340" width="210" height="64" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="625.0" y="367.77500000000003" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">ADD</text>
<text x="625.0" y="385.32500000000005" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">(v&lt;&lt;shlV) + t·mulT&lt;&lt;shlT</text>
<polyline points="730,372 760,372" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ak)"/>
<rect x="760" y="340" width="190" height="64" rx="6" fill="#e9f5e7" stroke="#3c8a35" stroke-width="1.6"/>
<text x="855.0" y="367.77500000000003" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">RQ</text>
<text x="855.0" y="385.32500000000005" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">round, shift, lo, hi</text>
<polyline points="950,372 980,372" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ak)"/>
<rect x="980" y="340" width="120" height="64" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="1040.0" y="367.77500000000003" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">f2</text>
<text x="1040.0" y="385.32500000000005" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal">ADD 뒤 단항</text>
<polyline points="1100,372 1130,372" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ak)"/>
<rect x="1130" y="340" width="130" height="64" rx="6" fill="#e8f0fa" stroke="#2f5f98" stroke-width="1.6"/>
<text x="1195.0" y="376.55" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">out int8</text>
<text x="700" y="440" font-size="13" fill="#888888" text-anchor="middle" font-weight="normal">ADD가 없으면 f1만 있다. ADD는 하나까지 (residual 텐서 하나를 inp에 둠)</text>
<text x="40" y="490" font-size="15" fill="#333333" text-anchor="start" font-weight="bold">f1 / f2 분류: −128..127 입력 256개를 실제로 계산해 보고 모양을 찾는다</text>
<rect x="40" y="515" width="420" height="150" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="250.0" y="576.0" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">종류 0: clip(x, a, b)</text>
<text x="250.0" y="594.9" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">예: relu, ReLU6, 아무것도 안 함</text>
<text x="250.0" y="613.8" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">EVTA: 앞 clip 범위에 합침 → 명령 0개</text>
<rect x="490" y="515" width="420" height="150" rx="6" fill="#fbf6dc" stroke="#9a7b00" stroke-width="1.6"/>
<text x="700.0" y="576.0" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">종류 1: clip(x &lt;&lt; q, a, b)</text>
<text x="700.0" y="594.9" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">예: relu 뒤 scale ½ (SHL 1)</text>
<text x="700.0" y="613.8" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">EVTA: ALU SHR −q, MAX, MIN</text>
<rect x="940" y="515" width="420" height="150" rx="6" fill="#f1eaf8" stroke="#6d4596" stroke-width="1.6"/>
<text x="1150.0" y="566.55" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">종류 2: 그 밖 (표)</text>
<text x="1150.0" y="585.4499999999999" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">예: GELU, sigmoid</text>
<text x="1150.0" y="604.3499999999999" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">EVTA: ALU LUT (_alux 이상)</text>
<text x="1150.0" y="623.25" font-size="14" fill="#333333" text-anchor="middle" font-weight="normal">표는 conv마다 하나</text>
<text x="700" y="705" font-size="13" fill="#c06a10" text-anchor="middle" font-weight="normal">못 하는 경우(표 2개, ADD 2개, MUL add 뒤 shift·표, 확장 없는 비트스트림의 LUT·MUL, rq 없는 비트스트림의 round 2) → false → CPU 경로</text>
<text x="700" y="732" font-size="13" fill="#888888" text-anchor="middle" font-weight="normal">결과는 (프로그램, 표 내용, conv relu/clip, EVTA 번호)로 캐시하고 replay key에도 넣는다</text>
</svg>
